<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Mini Games</h1>
    <p>Small games you can play in the browser, on your phone or your laptop.</p>
  </header>

  <ul class="games">
    <li>
      <a href="games/flappy-bird/">
        <span class="emoji">🐦</span>
        <span class="name">Flappy Bird</span>
        <span class="desc">Tap to flap. Don't hit the pipes.</span>
      </a>
    </li>
    <li>
      <a href="games/snake/">
        <span class="emoji">🐍</span>
        <span class="name">Snake</span>
        <span class="desc">Eat, grow, don't bite yourself.</span>
      </a>
    </li>
  </ul>
</body>
</html>
